
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="todo.css">
    <title>todo-list </title>
    <style>

    </style>
</head>
<body>
    <div class="card">
        <h1 class="heading">
            <span>✓</span>
            My Todo List
        </h1>
        <div class="input">
            <input type="text" class="texting" placeholder="What needs to be done?">
            <button class="add">+</button>
        </div>

        <div class="filter">
            <button class="all">All</button>
            <button class="active">Active</button>
            <button class="Completed">Completed</button>
        </div>
        <ul class="empty">
            <li> </li>
        </ul>
        <div class="footer">
            <span class="items">0 items left</span>
            <button class="Clear">Clear completed</button>
        </div>
    </div>
    <script src="todo.js">
    </script>
</body>

</html>
